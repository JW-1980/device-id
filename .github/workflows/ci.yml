name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Gates and PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Framework-free proof
        run: php tools/prove-standalone.php

      - name: Golden values
        run: php tools/golden-check.php

      - name: Standalone demo
        run: php demo/standalone-demo.php > /dev/null

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: The gates left the tree unchanged
        # No gate may write into the package; a difference means the run verified a tree that
        # is not the one committed.
        run: git diff --exit-code

  collectors:
    name: Browser collectors (typecheck, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Vitest
        run: npm test
